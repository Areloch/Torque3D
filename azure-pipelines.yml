# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- Preview4_0

pool:
  vmImage: windows-latest

steps:
- task: CMake@1
  inputs:
    cmakeArgs: '-G \"Visual Studio 2022\" -DTORQUE_APP_NAME:STRING=\"Torque3D\"'

- task: VSBuild@1
  inputs:
    solution: '**\*.sln'
    platform: 'x64'
    configuration: 'release'
